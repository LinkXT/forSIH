<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
<title>MindMitra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF3EC;
    --mist: #DCE7DE;
    --surface: #FFFFFF;
    --pine: #2F6F4F;
    --pine-dark: #1F4E37;
    --pine-light: #D9EAE0;
    --marigold: #E8A33D;
    --marigold-dark: #C9821F;
    --ink: #1F2A24;
    --ink-soft: #4B5A50;
    --line: #D3DED7;
    --danger: #C1502E;
    --danger-bg: #FBE9E2;
    --ok: #2F6F4F;
    --radius: 18px;
    --shadow: 0 6px 20px rgba(31,42,36,0.08);
    --focus: 3px solid #1F6FBF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    font-size:18px;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Poppins',sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible, [tabindex]:focus-visible, input:focus-visible{outline:var(--focus); outline-offset:2px;}
  ::selection{background:var(--marigold); color:var(--ink);}
  #app{min-height:100vh; display:flex; flex-direction:column;}
  .wrap{max-width:1000px; margin:0 auto; width:100%; padding:0 20px;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; background:var(--surface); border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:38px; height:38px; border-radius:11px; background:var(--pine);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-mark svg{width:22px; height:22px;}
  .brand-name{font-family:'Poppins',sans-serif; font-weight:700; font-size:22px; color:var(--pine-dark); letter-spacing:-0.01em;}
  .brand-sub{font-size:13px; color:var(--ink-soft); margin-top:-2px;}
  .topbar-actions{display:flex; align-items:center; gap:14px;}
  .who{font-size:15px; color:var(--ink-soft);}
  .who b{color:var(--ink);}
  .btn-ghost{
    background:transparent; border:1.5px solid var(--line); color:var(--ink-soft);
    padding:10px 16px; border-radius:12px; font-size:15px; font-weight:600;
  }
  .btn-ghost:hover{border-color:var(--pine); color:var(--pine-dark);}

  /* ---------- Buttons ---------- */
  .btn{
    border:none; border-radius:14px; padding:16px 24px; font-size:19px; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
  }
  .btn-primary{background:var(--pine); color:#fff;}
  .btn-primary:hover{background:var(--pine-dark);}
  .btn-primary:disabled{background:#A9BEB0; cursor:not-allowed;}
  .btn-gold{background:var(--marigold); color:#2A1C05;}
  .btn-gold:hover{background:var(--marigold-dark);}
  .btn-outline{background:#fff; border:2px solid var(--pine); color:var(--pine-dark);}
  .btn-outline:hover{background:var(--pine-light);}
  .btn-lg{padding:22px 28px; font-size:22px; border-radius:16px; width:100%;}
  .btn-sm{padding:8px 14px; font-size:14px; border-radius:10px;}

  /* ---------- Landing / login ---------- */
  .center-col{flex:1; display:flex; align-items:center; justify-content:center; padding:32px 20px;}
  .hero-panel{max-width:640px; width:100%; text-align:center;}
  .hero-mark{
    width:84px; height:84px; border-radius:24px; background:var(--pine); margin:0 auto 22px;
    display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);
  }
  .hero-mark svg{width:46px; height:46px;}
  .hero-title{font-size:38px; font-weight:700; color:var(--pine-dark); margin:0 0 8px;}
  .hero-tag{font-size:19px; color:var(--ink-soft); margin:0 0 40px;}
  .role-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media (max-width:560px){.role-grid{grid-template-columns:1fr;}}
  .role-card{
    background:var(--surface); border:2px solid var(--line); border-radius:var(--radius);
    padding:32px 20px; text-align:center; transition:border-color .15s, transform .1s;
  }
  .role-card:hover{border-color:var(--pine); transform:translateY(-2px);}
  .role-card .role-icon{
    width:64px; height:64px; border-radius:18px; margin:0 auto 16px; display:flex; align-items:center;
    justify-content:center;
  }
  .role-card.patient .role-icon{background:var(--pine-light);}
  .role-card.staff .role-icon{background:#F5E7D0;}
  .role-icon svg{width:34px; height:34px;}
  .role-card h3{font-size:22px; margin:0 0 6px; color:var(--ink);}
  .role-card p{font-size:15px; color:var(--ink-soft); margin:0 0 20px;}

  .panel{
    background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:32px; width:100%; max-width:640px;
  }
  .panel-head{display:flex; align-items:center; gap:14px; margin-bottom:24px;}
  .back-btn{
    width:44px; height:44px; border-radius:12px; border:1.5px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .back-btn:hover{border-color:var(--pine);}
  .panel-head h2{margin:0; font-size:24px;}

  .person-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:8px;}
  @media (max-width:480px){.person-grid{grid-template-columns:1fr;}}
  .person-card{
    display:flex; align-items:center; gap:14px; background:#fff; border:2px solid var(--line);
    border-radius:16px; padding:16px; text-align:left;
  }
  .person-card:hover{border-color:var(--pine); background:var(--pine-light);}
  .avatar{
    width:52px; height:52px; border-radius:50%; background:var(--pine); color:#fff; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:19px; font-family:'Poppins',sans-serif;
  }
  .person-card .pname{font-weight:600; font-size:17px;}
  .person-card .pmeta{font-size:13px; color:var(--ink-soft);}

  .pin-display{display:flex; justify-content:center; gap:14px; margin:28px 0;}
  .pin-dot{width:22px; height:22px; border-radius:50%; border:2px solid var(--pine); background:#fff;}
  .pin-dot.filled{background:var(--pine);}
  .pin-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; max-width:340px; margin:0 auto;}
  .pin-key{
    background:#fff; border:2px solid var(--line); border-radius:16px; font-size:26px; font-weight:600;
    padding:20px 0; color:var(--ink);
  }
  .pin-key:hover{border-color:var(--pine); background:var(--pine-light);}
  .pin-key.wide{grid-column:span 1;}
  .pin-hint{text-align:center; color:var(--ink-soft); font-size:14px; margin-top:18px;}
  .error-msg{
    background:var(--danger-bg); color:var(--danger); border-radius:12px; padding:12px 16px;
    font-size:15px; font-weight:600; text-align:center; margin-top:16px;
  }

  /* ---------- Patient dashboard ---------- */
  .greet-band{
    background:linear-gradient(135deg, var(--pine) 0%, var(--pine-dark) 100%); color:#fff;
    padding:28px 0; margin-bottom:28px;
  }
  .greet-band .wrap{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;}
  .greet-band h1{font-size:28px; margin:0 0 4px;}
  .greet-band p{margin:0; opacity:0.9; font-size:15px;}
  .today-pill{
    background:rgba(255,255,255,0.15); border-radius:14px; padding:12px 18px; font-size:15px; text-align:center;
  }
  .today-pill b{display:block; font-size:22px; font-family:'Poppins',sans-serif;}

  .section-title{font-size:21px; font-weight:700; margin:0 0 16px; color:var(--ink);}
  .game-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px; margin-bottom:32px;}
  @media (max-width:640px){.game-grid{grid-template-columns:1fr;}}
  .game-card{
    background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px;
    display:flex; flex-direction:column; gap:12px;
  }
  .game-icon{width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center;}
  .game-icon svg{width:30px; height:30px;}
  .game-card h3{margin:0; font-size:19px;}
  .game-card p{margin:0; font-size:14.5px; color:var(--ink-soft); flex:1;}
  .game-card .played-tag{font-size:13px; color:var(--pine-dark); font-weight:600;}

  .summary-panel{
    background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; margin-bottom:28px;
  }
  .summary-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line);}
  .summary-row:last-child{border-bottom:none;}
  .summary-empty{color:var(--ink-soft); font-size:15px; padding:8px 0;}
  .score-chip{
    font-family:'Poppins',sans-serif; font-weight:700; font-size:16px; padding:5px 12px; border-radius:20px;
    background:var(--pine-light); color:var(--pine-dark);
  }
  .finish-box{
    background:#FBF6EA; border:2px dashed var(--marigold); border-radius:var(--radius); padding:24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:32px;
  }
  .finish-box h3{margin:0 0 4px; font-size:18px;}
  .finish-box p{margin:0; font-size:14.5px; color:var(--ink-soft); max-width:420px;}

  /* ---------- Game screens ---------- */
  .game-shell{padding:24px 0 60px;}
  .game-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px;}
  .game-header h2{margin:0; font-size:24px;}
  .game-stats{display:flex; gap:10px; flex-wrap:wrap;}
  .stat-pill{background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:8px 14px; font-size:14px; font-weight:600; color:var(--ink-soft);}
  .stat-pill b{color:var(--ink); font-family:'Poppins',sans-serif;}
  .game-board{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:28px; text-align:center;}

  /* memory match */
  .mm-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; max-width:480px; margin:0 auto;}
  @media (max-width:480px){.mm-grid{grid-template-columns:repeat(3,1fr);}}
  .mm-card{
    aspect-ratio:1; border-radius:14px; background:var(--pine); display:flex; align-items:center; justify-content:center;
    font-size:30px; border:none; color:transparent;
  }
  .mm-card.flipped, .mm-card.matched{background:var(--pine-light); color:var(--ink);}
  .mm-card.matched{background:#DCEFDF; box-shadow:inset 0 0 0 2px var(--pine);}
  .mm-card:disabled{cursor:default;}

  /* sequence */
  .seq-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:340px; margin:20px auto;}
  .seq-tile{
    aspect-ratio:1; border-radius:20px; border:none; opacity:0.55; transition:opacity .12s, transform .08s;
  }
  .seq-tile.lit{opacity:1; transform:scale(0.97);}
  .seq-tile:disabled{cursor:default;}
  .seq-tile.red{background:#D95C48;} .seq-tile.blue{background:#3E7CB1;}
  .seq-tile.gold{background:var(--marigold);} .seq-tile.green{background:var(--pine);}
  .seq-status{font-size:18px; font-weight:600; margin-bottom:8px; min-height:26px;}

  /* spelling */
  .word-target{font-size:15px; color:var(--ink-soft); margin-bottom:6px;}
  .word-slots{display:flex; justify-content:center; gap:8px; margin:18px 0; flex-wrap:wrap;}
  .word-slot{
    width:46px; height:52px; border-bottom:3px solid var(--pine); font-size:26px; font-weight:700;
    display:flex; align-items:center; justify-content:center; font-family:'Poppins',sans-serif;
  }
  .letter-bank{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:24px;}
  .letter-tile{
    width:52px; height:52px; border-radius:12px; background:var(--pine); color:#fff; border:none;
    font-size:22px; font-weight:700; font-family:'Poppins',sans-serif;
  }
  .letter-tile:disabled{opacity:0.25;}

  /* sliding puzzle */
  .sp-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:320px; margin:0 auto;}
  .sp-tile{
    aspect-ratio:1; border-radius:12px; background:var(--pine); color:#fff; border:none;
    font-size:28px; font-weight:700; font-family:'Poppins',sans-serif;
  }
  .sp-tile.blank{background:var(--bg); box-shadow:inset 0 0 0 2px var(--line);}

  .result-card{padding:12px 0;}
  .result-score{font-size:52px; font-weight:700; color:var(--pine-dark); font-family:'Poppins',sans-serif;}
  .result-actions{display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap;}

  /* ---------- Staff dashboard ---------- */
  .alert-banner{
    background:var(--danger-bg); border:1.5px solid #EBC0AE; color:var(--danger);
    border-radius:16px; padding:16px 20px; display:flex; align-items:center; gap:12px; margin-bottom:24px; font-weight:600;
  }
  .staff-toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:12px;}
  .patient-row{
    background:var(--surface); border-radius:16px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:12px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .patient-row:hover{outline:2px solid var(--pine-light);}
  .patient-row .pinfo{flex:1; min-width:180px;}
  .patient-row .pinfo .pname{font-weight:700; font-size:17px;}
  .patient-row .pinfo .pmeta{font-size:13.5px; color:var(--ink-soft);}
  .trend-badge{font-size:13px; font-weight:700; padding:6px 12px; border-radius:20px; white-space:nowrap;}
  .trend-badge.up{background:var(--pine-light); color:var(--pine-dark);}
  .trend-badge.flat{background:#EFEFEF; color:var(--ink-soft);}
  .trend-badge.down{background:var(--danger-bg); color:var(--danger);}
  .spark{flex-shrink:0;}
  .add-patient-form{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;}
  @media (max-width:480px){.add-patient-form{grid-template-columns:1fr;}}
  .field{display:flex; flex-direction:column; gap:6px; text-align:left;}
  .field label{font-size:13px; font-weight:600; color:var(--ink-soft);}
  .field input{padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); font-size:16px;}

  .detail-history{margin-top:22px;}
  .hist-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); gap:12px; flex-wrap:wrap;}
  .hist-row .hd{font-size:13.5px; color:var(--ink-soft);}
  .games-breakdown{display:flex; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft);}
  .games-breakdown span{background:var(--bg); border-radius:8px; padding:3px 8px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:14px 24px; border-radius:14px; font-size:15px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,0.25);
    z-index:50; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  .footnote{text-align:center; color:var(--ink-soft); font-size:13px; padding:20px 0 40px;}

  .flash-correct{animation:flashg .5s;}
  .flash-wrong{animation:flashr .5s;}
  @keyframes flashg{0%{background:#DCEFDF;}100%{background:var(--surface);}}
  @keyframes flashr{0%{background:var(--danger-bg);}100%{background:var(--surface);}}

  /* ================= motion system =================
     Purposeful, short animations only — entrances, feedback on tap, and
     state changes. No infinite ambient motion: for users with memory or
     attention conditions, constant background movement is distracting
     rather than "premium". Everything here is silenced automatically by
     the prefers-reduced-motion rule below. */
  :root{ --ease: cubic-bezier(.22,.61,.36,1); }

  #app{animation: screenIn .3s var(--ease);}
  @keyframes screenIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  button, .person-card, .role-card, select, input{
    transition: transform .15s var(--ease), background-color .18s var(--ease),
                border-color .18s var(--ease), box-shadow .18s var(--ease), opacity .18s var(--ease);
  }
  .btn:active:not(:disabled), .btn-outline:active, .btn-gold:active, .btn-ghost:active,
  .pin-key:active, .letter-tile:active:not(:disabled), .person-card:active, .role-card:active,
  .mm-card:active:not(:disabled), .seq-tile:active:not(:disabled), .sp-tile:active{
    transform: scale(0.96);
  }
  .role-card:hover{ transform: translateY(-3px); }

  @keyframes cardIn{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  .role-card, .game-card{ animation: cardIn .4s var(--ease) both; }
  .role-card:nth-child(1){ animation-delay:.03s; } .role-card:nth-child(2){ animation-delay:.11s; }

  @keyframes rowIn{ from{opacity:0; transform:translateX(-10px);} to{opacity:1; transform:translateX(0);} }
  .patient-row{ animation: rowIn .35s var(--ease) both; }

  @keyframes pinPop{ 0%{transform:scale(0.5);} 60%{transform:scale(1.25);} 100%{transform:scale(1);} }
  .pin-dot.filled{ animation: pinPop .28s var(--ease); }

  @keyframes cardReveal{ 0%{transform:scale(0.9);} 60%{transform:scale(1.04);} 100%{transform:scale(1);} }
  .mm-card.flipped{ animation: cardReveal .22s var(--ease); }
  @keyframes matchPop{ 0%{transform:scale(0.92);} 45%{transform:scale(1.1);} 100%{transform:scale(1);} }
  .mm-card.matched{ animation: matchPop .4s var(--ease); }

  @keyframes tilePulse{ 0%{transform:scale(1); box-shadow:0 0 0 0 rgba(0,0,0,0);} 35%{transform:scale(1.07); box-shadow:0 0 0 10px rgba(0,0,0,0.06);} 100%{transform:scale(1); box-shadow:0 0 0 0 rgba(0,0,0,0);} }
  .seq-tile.lit{ animation: tilePulse .5s var(--ease); }
  .seq-tile{ transition: opacity .15s var(--ease), transform .12s var(--ease); }

  @keyframes checkPop{ 0%{transform:scale(0.6); opacity:0;} 60%{transform:scale(1.15);} 100%{transform:scale(1); opacity:1;} }
  .reminder-check-anim{ animation: checkPop .3s var(--ease); }

  @keyframes badgePulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  .trend-badge.down{ animation: badgePulse 1s var(--ease) 2; }

  @keyframes bannerIn{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }
  .alert-banner{ animation: bannerIn .35s var(--ease); }

  @keyframes dash{ to{ stroke-dashoffset:0; } }
  .spark-draw polyline{ animation: dash 1s var(--ease) forwards; }

  @keyframes scoreIn{ from{opacity:0; transform:scale(0.7);} to{opacity:1; transform:scale(1);} }
  .result-score{ animation: scoreIn .45s var(--ease); }
  .result-card{ position:relative; overflow:visible; }

  .confetti-piece{ position:absolute; top:6px; width:8px; height:8px; border-radius:2px; opacity:0.95; pointer-events:none; animation: confettiFall 1.1s ease-out forwards; }
  @keyframes confettiFall{ 0%{transform:translate(0,0) rotate(0deg); opacity:1;} 100%{transform:translate(var(--dx,0px), 170px) rotate(360deg); opacity:0;} }

  .toast{ transition: opacity .3s var(--ease), transform .3s var(--ease); transform:translateX(-50%) translateY(4px) scale(0.96); }
  .toast.show{ transform:translateX(-50%) translateY(-6px) scale(1); }

  @keyframes waveIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .greet-band, .hero-panel, .panel{ animation: waveIn .35s var(--ease); }

  @media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================================
   MINDMITRA — memory-care companion for elderly patients in North-East India
   Single-file front-end demo.

   DATA MODEL
   - window.storage (Anthropic artifact persistence API) = the "server".
     Writing here simulates the nightly upload once devices are collected
     and connectivity is available.
   - `pendingSession` (plain JS object, in memory only) = the "on-device"
     cache for whatever the patient plays TODAY. It is never written to
     window.storage until staff/patient taps "Finish Day & Save to Server",
     mirroring the real workflow: play offline all day, sync once at night.
   ========================================================================= */

// ---------------------------------------------------------------- constants
const ICONS = {
  logo: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4-3-8-6.5-8-11a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 4.5-4 8-8 11 0-3 0-9 0-9"/></svg>`,

/* =========================================================================

   Translation Mission (Project Bhashini, MeitY).

   Used here so patients across North-East India — where Assamese, Bengali,
   Manipuri (Meitei), Nepali and Hindi speakers may be far more comfortable
   than with English — can use MindMitra in their own language, and can
   have instructions read aloud (useful for low-literacy or low-vision
   users). This follows Bhashini's standard three-step flow: Pipeline
   Config -> Pipeline Compute, for both translation (NMT) and
   text-to-speech (TTS). Reference: https://bhashini.gitbook.io/bhashini-apis

   A free userID + ulcaApiKey can be requested at https://bhashini.gov.in
   ("Bhashini Sahyogi" signup). Paste them into Language Settings (gear
   icon, top right) to switch this on. Without credentials, the app simply
   stays in English — nothing else breaks.

   PRODUCTION NOTE: browsers calling meity-auth.ulcacontrib.org directly
   can hit CORS restrictions, and shipping the ulcaApiKey to every device
   isn't good practice. In production, point BHASHINI.pipelineConfigUrl at
   your own backend, which proxies these two calls server-side and keeps
   the key off the client. That backend can also cache translations
   centrally instead of per-device.
   ========================================================================= */

async function getBhashiniPipeline(taskType, sourceLanguage, targetLanguage, creds){
  const body = {
    pipelineTasks: [{ taskType, config: { language: { sourceLanguage, targetLanguage: targetLanguage||undefined } } }],
    pipelineRequestConfig: { pipelineId: BHASHINI.pipelineId }
  };
  const res = await fetch(BHASHINI.pipelineConfigUrl, {
    method:"POST",
    headers: { "Content-Type":"application/json", "userID": creds.userId, "ulcaApiKey": creds.apiKey },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("Bhashini pipeline config failed ("+res.status+")");
  const data = await res.json();
  const serviceId = data.pipelineResponseConfig[0].config[0].serviceId;
  const callbackUrl = data.pipelineInferenceAPIEndPoint.callbackUrl;
  const authName = data.pipelineInferenceAPIEndPoint.inferenceApiKey.name;
  const authValue = data.pipelineInferenceAPIEndPoint.inferenceApiKey.value;
  return { serviceId, callbackUrl, authName, authValue };
}

// Translates a batch of strings in ONE call (cheaper + faster than one call per string).
async function bhashiniTranslateBatch(strings, targetLang, creds){
  if(targetLang==="en") return strings.slice();
  const { serviceId, callbackUrl, authName, authValue } = await getBhashiniPipeline("translation", "en", targetLang, creds);
  const res = await fetch(callbackUrl, {
    method:"POST",
    headers: { "Content-Type":"application/json", [authName]: authValue },
    body: JSON.stringify({
      pipelineTasks: [{ taskType:"translation", config:{ language:{ sourceLanguage:"en", targetLanguage:targetLang }, serviceId } }],
      inputData: { input: strings.map(s=>({ source:s })) }
    })
  });
  if(!res.ok) throw new Error("Bhashini translation failed ("+res.status+")");
  const data = await res.json();
  return data.pipelineResponse[0].output.map(o=>o.target);
}

// Text-to-speech for a single string; returns a playable data: URL, or null on failure.
async function bhashiniSpeak(text, lang, creds){
  const { serviceId, callbackUrl, authName, authValue } = await getBhashiniPipeline("tts", lang, null, creds);
  const res = await fetch(callbackUrl, {
    method:"POST",
    headers: { "Content-Type":"application/json", [authName]: authValue },
    body: JSON.stringify({
      pipelineTasks: [{ taskType:"tts", config:{ language:{ sourceLanguage:lang }, serviceId, gender:"female", samplingRate:8000 } }],
      inputData: { input: [{ source:text }] }
    })
  });
  if(!res.ok) throw new Error("Bhashini TTS failed ("+res.status+")");
  const data = await res.json();
  return "data:audio/wav;base64," + data.pipelineResponse[0].audio[0].audioContent;
}

// t(key) — returns the cached translation for the active language, English otherwise.
function t(key){
  const cache = state.translations[state.lang];
  return (cache && cache[key]) || UI_STRINGS[key] || key;
}

// Fetches + caches translations for every UI_STRINGS entry in one Bhashini call,
// then persists the cache so this only needs to happen once per language
// (useful given intermittent connectivity — translate once when online, reuse offline after).
async function ensureTranslations(lang){
  if(lang==="en" || state.translations[lang]) return true;
  try{
    const cached = await storageGet("mindmitra:translations:"+lang, true);
    if(cached){ state.translations[lang] = JSON.parse(cached.value); return true; }
  }catch(e){ /* not cached yet */ }
  if(!state.bhashiniCreds.userId || !state.bhashiniCreds.apiKey) return false;
  const keys = Object.keys(UI_STRINGS);
  const translated = await bhashiniTranslateBatch(keys.map(k=>UI_STRINGS[k]), lang, state.bhashiniCreds);
  const map = {};
  keys.forEach((k,i)=> map[k]=translated[i]);
  state.translations[lang] = map;
  await storageSet("mindmitra:translations:"+lang, JSON.stringify(map), true);
  return true;
}

  }
}

function checkDueReminders(){
  if(state.role!=="patient" || !state.currentUser) return;
  const pid = state.currentUser.id;
  const rem = state.remindersCache && state.remindersCache[pid];
  const session = pendingReminders[pid];
  if(!rem || !session) return;
  const now = new Date();
  const nowMins = now.getHours()*60 + now.getMinutes();
  let changed = false;
  rem.forEach(r=>{
    const [h,m] = r.time.split(":").map(Number);
    if(nowMins >= (h*60+m) && !session.doneIds.includes(r.id) && !session.notifiedIds.includes(r.id)){
      session.notifiedIds.push(r.id);
      showToast("Reminder: " + r.label);
      if(state.lang!=="en") speak(r.label);
      changed = true;
    }
  });
  if(changed && state.screen==="patientHome") render();
}

// ---------------------------------------------------------------- storage
/* window.storage only exists inside Claude.ai's own artifact preview.
   Once this file is downloaded and opened directly (double-clicked, or
   hosted on any normal web server), that API isn't there — so this
   wrapper falls back to localStorage (and, as a last resort, an
   in-memory object) so the app works the same way everywhere. */
const memoryFallbackStore = {};
async function storageGet(key, shared){
  if(typeof window.storage !== "undefined"){
    try{ return await window.storage.get(key, shared); }catch(e){ return null; }
  }
  try{
    const v = localStorage.getItem(key);
    return v===null ? null : { key, value:v, shared };
  }catch(e){
    return (key in memoryFallbackStore) ? { key, value:memoryFallbackStore[key], shared } : null;
  }
}
async function storageSet(key, value, shared){
  if(typeof window.storage !== "undefined"){
    try{ return await window.storage.set(key, value, shared); }catch(e){ return null; }
  }
  try{
    localStorage.setItem(key, value);
    return { key, value, shared };
  }catch(e){
    memoryFallbackStore[key] = value;
    return { key, value, shared };
  }
}
function todayStr(offsetDays=0){

async function seedDemoData(){
  const patients = [
    { id:"p1", role:"patient", name:"Nokcha Longkumer", age:71, village:"Kohima", pin:"1234", declining:false },
    { id:"p2", role:"patient", name:"Ibemhal Devi",      age:68, village:"Imphal", pin:"1234", declining:false },
    { id:"p3", role:"patient", name:"Lalrinawmi Ralte",  age:74, village:"Aizawl", pin:"1234", declining:true  },
    { id:"p4", role:"patient", name:"Biren Bora",        age:79, village:"Tezpur", pin:"1234", declining:false },
  ];
  const staff = [
    { id:"s1", role:"staff", name:"Dr. Aiyeta Sangma", title:"Medical Officer", pin:"1234" },
    { id:"s2", role:"staff", name:"Rhea Marak", title:"Care Coordinator", pin:"1234" },
  ];
  state.users = [...patients, ...staff];
  await saveUsers();

  for(const p of patients){
    const history = [];
    const nDays = 10;
    for(let i=nDays; i>=1; i--){
      const dayIdx = nDays - i;
      let base = p.declining ? (78 - dayIdx*4.2) : (62 + dayIdx*1.4);
      const games = GAMES.map(g => ({
        gameId:g.id, label:g.title,
        score: scoreFor(dayIdx, base, 6),
        detail: sampleDetail(g.id)
      }));
      const dailyScore = Math.round(games.reduce((a,b)=>a+b.score,0)/games.length);
      history.push({ date: todayStr(-i), games, dailyScore, synced:true });
    }
    await saveHistory(p.id, history);
    await saveReminders(p.id, defaultReminders());
  }
}

// Counts a number up to its target with an eased finish — used for score reveals.
function animateNumber(el, target, duration=650){
  const startTime = performance.now();
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduced){ el.textContent = target; return; }
  function tick(now){
    const p = Math.min(1, (now-startTime)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(target * eased);
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// A brief, tasteful confetti burst — used sparingly (e.g. a strong game score),
// never as background motion. Skips itself under reduced-motion.
function celebrate(container){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#2F6F4F","#E8A33D","#3E7CB1","#D95C48"];
  for(let i=0;i<14;i++){
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = (40 + Math.random()*20) + "%";
    piece.style.background = colors[i % colors.length];
    piece.style.animationDelay = (Math.random()*0.12) + "s";
    piece.style.setProperty("--dx", Math.round(Math.random()*160-80) + "px");
    container.appendChild(piece);
    setTimeout(()=> piece.remove(), 1300);
  }
}

// Plays a short spoken version of `text` in the active language via Bhashini TTS.
async function speak(text){
  if(state.lang==="en"){ showToast("Switch to a regional language to hear it read aloud."); return; }
  if(!state.bhashiniCreds.userId || !state.bhashiniCreds.apiKey){ showToast("Add your Bhashini API key in Language Settings first."); return; }
  try{
    showToast("Loading audio…");
    const url = await bhashiniSpeak(text, state.lang, state.bhashiniCreds);
    new Audio(url).play();
  }catch(e){
    showToast("Couldn't reach Bhashini's voice service right now.");
  }
}

async function finishDay(){
  const u = state.currentUser;
  const session = pendingSession[u.id];
  if(!session || session.games.length===0) return;
  state.busy = true;
  showToast("Saving today's progress to the server…");
  const dailyScore = Math.round(session.games.reduce((a,b)=>a+b.score,0)/session.games.length);
  const history = await loadHistory(u.id);
  const existingIdx = history.findIndex(h=>h.date===session.date);
  const remTotal = (state.remindersCache[u.id]||[]).length;
  const remDone = (pendingReminders[u.id]||{doneIds:[]}).doneIds.length;
  const record = {
    date: session.date,
    games: session.games.map(({gameId,label,score,detail})=>({gameId,label,score,detail})),
    dailyScore, synced:true,
    reminders: { total: remTotal, completed: remDone }
  };
  if(existingIdx>=0) history[existingIdx] = record; else history.push(record);
  await saveHistory(u.id, history);
  await new Promise(r=>setTimeout(r, 600));
  delete pendingSession[u.id];
  delete pendingReminders[u.id];
  showToast("Saved! Today's progress is safe on the server.");
  doLogout();
}

// ------------------------------------------------------------------ game
function startGame(gameId){
  state.activeGame = gameId;
  state.gameState = initGameState(gameId);
  state.lastResult = null;
  go("game");
}
function initGameState(gameId){
  if(gameId==="match"){
    const pairCount = 6;
    const chosen = shuffle(MEMORY_ICONS.slice()).slice(0,pairCount);
    const deck = shuffle([...chosen, ...chosen]).map((icon,i)=>({ id:i, icon, flipped:false, matched:false }));
    return { deck, flippedIds:[], mistakes:0, matches:0, startedAt:Date.now(), locked:false };
  }
  if(gameId==="seq"){
    return { pattern:[nextColor()], userIdx:0, level:1, showing:true, litIdx:-1, mistakes:0, startedAt:Date.now(), status:"Watch the pattern…" };
  }
  if(gameId==="word"){
    const words = shuffle(WORD_BANK.slice()).slice(0,5);
    return { words, wordIdx:0, phase:"show", target:words[0], typed:[], bank:shuffle(words[0].split("")), correct:0, startedAt:Date.now() };
  }
  if(gameId==="puzzle"){
    let tiles;
    do { tiles = shuffle([1,2,3,4,5,6,7,8,0]); } while(!isSolvable(tiles) || isSolved(tiles));
    return { tiles, moves:0, startedAt:Date.now() };
  }
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function nextColor(){ return ["red","blue","gold","green"][Math.floor(Math.random()*4)]; }

function renderGame(app){
  topbar(app, { showLogout:true, backTo: ()=> go("patientHome") });
  const shell = document.createElement("div"); shell.className = "wrap game-shell";
  const g = GAMES.find(x=>x.id===state.activeGame);

  const gTitle = t("game_"+g.id+"_title");

  if(state.lastResult){
    shell.innerHTML = `
      <div class="game-header">
        <h2>${gTitle} — Complete</h2>
      </div>
      <div class="game-board result-card">
        <div style="font-size:16px; color:var(--ink-soft);">${t("yourScore")}</div>
        <div class="result-score" id="resultScoreNum">0</div>
        <div style="color:var(--ink-soft); font-size:15px;">${state.lastResult.summary}</div>
        <div class="result-actions">
          <button class="btn btn-outline" id="againBtn">${t("playAgain")}</button>
          <button class="btn btn-primary" id="doneBtn">${t("backToGames")}</button>
        </div>
      </div>
    `;
    app.appendChild(shell);
    animateNumber(shell.querySelector("#resultScoreNum"), state.lastResult.score);
    if(state.lastResult.score >= 75) celebrate(shell.querySelector(".result-card"));
    shell.querySelector("#againBtn").onclick = ()=> startGame(state.activeGame);
    shell.querySelector("#doneBtn").onclick = ()=> go("patientHome");
    return;
  }

  const header = document.createElement("div"); header.className = "game-header";
  header.innerHTML = `<h2>${gTitle}</h2><button class="btn-ghost" id="quitBtn">${t("exitGame")}</button>`;
  shell.appendChild(header);

  const board = document.createElement("div"); board.className = "game-board"; board.id = "board";
  shell.appendChild(board);
  app.appendChild(shell);

  shell.querySelector("#quitBtn").onclick = ()=> go("patientHome");

  if(state.activeGame==="match") renderMatchGame(board);
  if(state.activeGame==="seq") renderSeqGame(board);
  if(state.activeGame==="word") renderWordGame(board);
  if(state.activeGame==="puzzle") renderPuzzleGame(board);
}

function completeGame(gameId, score, detail, summary){
  score = Math.max(0, Math.min(100, Math.round(score)));
  const u = state.currentUser;
  const session = pendingSession[u.id];
  const label = GAMES.find(g=>g.id===gameId).title;
  session.games.push({ gameId, label, score, detail, playedAt: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) });
  state.lastResult = { gameId, score, summary };
  render();
}

/* ---------- Game 1: Picture Pairs (memory match) ---------- */
function renderMatchGame(board){
  const gs = state.gameState;
  board.innerHTML = `
    <div class="game-stats" style="justify-content:center; margin-bottom:18px;">
      <div class="stat-pill">Mistakes <b>${gs.mistakes}</b></div>
      <div class="stat-pill">Matched <b>${gs.matches}/${gs.deck.length/2}</b></div>
    </div>
    <div class="mm-grid" id="mmGrid"></div>
  `;
  const grid = board.querySelector("#mmGrid");
  gs.deck.forEach(card=>{
    const btn = document.createElement("button");
    btn.className = "mm-card" + (card.flipped||card.matched ? " flipped":"") + (card.matched?" matched":"");
    btn.textContent = (card.flipped||card.matched) ? card.icon : "";
    btn.disabled = card.matched || gs.locked;
    btn.onclick = ()=> flipCard(card.id);
    grid.appendChild(btn);
  });
}
function flipCard(id){
  const gs = state.gameState;
  if(gs.locked) return;
  const card = gs.deck.find(c=>c.id===id);
  if(!card || card.flipped || card.matched) return;
  card.flipped = true;
  gs.flippedIds.push(id);
  renderMatchGame(document.getElementById("board"));
  if(gs.flippedIds.length===2){
    gs.locked = true;
    const [a,b] = gs.flippedIds.map(i=>gs.deck.find(c=>c.id===i));
    const isMatch = a.icon===b.icon;
    setTimeout(()=>{
      if(isMatch){ a.matched=true; b.matched=true; gs.matches++; }
      else { a.flipped=false; b.flipped=false; gs.mistakes++; }
      gs.flippedIds = [];
      gs.locked = false;
      if(gs.matches === gs.deck.length/2){
        const timeSec = Math.round((Date.now()-gs.startedAt)/1000);
        const score = 100 - gs.mistakes*6 - timeSec*0.4;
        completeGame("match", score, {mistakes:gs.mistakes, timeSec}, `Finished in ${timeSec}s with ${gs.mistakes} mistakes.`);
        return;
      }
      renderMatchGame(document.getElementById("board"));
    }, isMatch?500:800);
  }
}

/* ---------- Game 2: Pattern Repeat (sequence recall) ---------- */
function renderSeqGame(board){
  const gs = state.gameState;
  board.innerHTML = `
    <div class="game-stats" style="justify-content:center; margin-bottom:6px;">
      <div class="stat-pill">Level <b>${gs.level}</b></div>
      <div class="stat-pill">Mistakes <b>${gs.mistakes}</b></div>
    </div>
    <div class="seq-status">${gs.status}</div>
    <div class="seq-grid" id="seqGrid">
      ${["red","blue","gold","green"].map(c=>`<button class="seq-tile ${c}" data-c="${c}" ${gs.showing?"disabled":""}></button>`).join("")}
    </div>
  `;
  if(gs.showing) playSequence();
  else {
    board.querySelectorAll(".seq-tile").forEach(btn=> btn.onclick = ()=> userTapColor(btn.dataset.c));
  }
}
function playSequence(){
  const gs = state.gameState;
  gs.showing = true;
  let i = 0;
  const tiles = ()=> document.querySelectorAll("#seqGrid .seq-tile");
  const step = ()=>{
    tiles().forEach(t=>t.classList.remove("lit"));
    if(i>0){
      const prevColor = gs.pattern[i-1];
    }
    if(i>=gs.pattern.length){
      gs.showing = false; gs.status = "Now repeat it back";
      renderSeqGame(document.getElementById("board"));
      return;
    }
    const color = gs.pattern[i];
    const el = [...tiles()].find(t=>t.dataset.c===color);
    el.classList.add("lit");
    setTimeout(()=>{
      el.classList.remove("lit");
      i++;
      setTimeout(step, 220);
    }, 550);
  };
  gs.status = "Watch the pattern…";
  setTimeout(step, 400);
}
function userTapColor(color){
  const gs = state.gameState;
  const expected = gs.pattern[gs.userIdx];
  const el = document.querySelector(`#seqGrid .seq-tile[data-c="${color}"]`);
  el.classList.add("lit"); setTimeout(()=>el.classList.remove("lit"), 180);
  if(color===expected){
    gs.userIdx++;
    if(gs.userIdx===gs.pattern.length){
      if(gs.level>=8){
        const score = gs.level*12.5;
        completeGame("seq", score, {level:gs.level}, `Reached level ${gs.level} — great working memory today.`);
        return;
      }
      gs.level++;
      gs.pattern.push(nextColor());
      gs.userIdx = 0;
      gs.showing = true;
      renderSeqGame(document.getElementById("board"));
    }
  } else {
    gs.mistakes++;
    if(gs.mistakes>=3 || gs.level===1){
      const score = Math.max(15, (gs.level-1)*12.5);
      completeGame("seq", score, {level:gs.level-1}, `Reached level ${Math.max(0,gs.level-1)} before a few mix-ups.`);
      return;
    }
    gs.userIdx = 0;
    gs.status = "Not quite — watch again";
    gs.showing = true;
    renderSeqGame(document.getElementById("board"));
  }
}

/* ---------- Game 3: Word Recall / Spelling ---------- */
function renderWordGame(board){
  const gs = state.gameState;
  if(gs.phase==="show"){
    board.innerHTML = `
      <p class="word-target">Remember this word</p>
      <div class="result-score" style="font-size:40px;">${gs.target}</div>
      <p style="color:var(--ink-soft); margin-top:18px;">It will disappear in a moment…</p>
    `;
    clearTimeout(renderWordGame._t);
    renderWordGame._t = setTimeout(()=>{
      gs.phase = "spell"; gs.typed = [];
      renderWordGame(document.getElementById("board"));
    }, 2600);
    return;
  }
  board.innerHTML = `
    <div class="game-stats" style="justify-content:center; margin-bottom:6px;">
      <div class="stat-pill">Word <b>${gs.wordIdx+1}/${gs.words.length}</b></div>
      <div class="stat-pill">Correct <b>${gs.correct}</b></div>
    </div>
    <p class="word-target">Spell the word you just saw</p>
    <div class="word-slots" id="slots">
      ${gs.target.split("").map((_,i)=>`<div class="word-slot">${gs.typed[i]||""}</div>`).join("")}
    </div>
    <div class="letter-bank" id="bank">
      ${gs.bank.map((l,i)=>`<button class="letter-tile" data-i="${i}">${l}</button>`).join("")}
    </div>
  `;
  board.querySelectorAll(".letter-tile").forEach(btn=>{
    btn.onclick = ()=>{
      if(btn.disabled) return;
      gs.typed.push(btn.textContent);
      btn.disabled = true;
      if(gs.typed.length===gs.target.length){
        const correct = gs.typed.join("")===gs.target;
        if(correct) gs.correct++;
        board.classList.add(correct?"flash-correct":"flash-wrong");
        setTimeout(()=>{
          board.classList.remove("flash-correct","flash-wrong");
          gs.wordIdx++;
          if(gs.wordIdx>=gs.words.length){
            const score = (gs.correct/gs.words.length)*100;
            completeGame("word", score, {correct:gs.correct, total:gs.words.length}, `Spelled ${gs.correct} of ${gs.words.length} words correctly.`);
            return;
          }
          gs.target = gs.words[gs.wordIdx];
          gs.bank = shuffle(gs.target.split(""));
          gs.phase = "show";
          renderWordGame(document.getElementById("board"));
        }, 700);
        return;
      }
      renderWordGame(document.getElementById("board"));
    };
  });
}

/* ---------- Game 4: Sliding Tile Puzzle ---------- */
function isSolved(tiles){ return tiles.slice(0,8).every((v,i)=>v===i+1) && tiles[8]===0; }
function isSolvable(tiles){
  const arr = tiles.filter(v=>v!==0);
  let inv=0;
  for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++) if(arr[i]>arr[j]) inv++;
  return inv%2===0;
}
function renderPuzzleGame(board){
  const gs = state.gameState;
  board.innerHTML = `
    <div class="game-stats" style="justify-content:center; margin-bottom:14px;">
      <div class="stat-pill">Moves <b>${gs.moves}</b></div>
    </div>
    <div class="sp-grid" id="spGrid">
      ${gs.tiles.map((v,i)=>`<button class="sp-tile ${v===0?"blank":""}" data-i="${i}">${v||""}</button>`).join("")}
    </div>
  `;
  board.querySelectorAll(".sp-tile").forEach(btn=>{
    btn.onclick = ()=> tapPuzzleTile(parseInt(btn.dataset.i));
  });
}
function tapPuzzleTile(idx){
  const gs = state.gameState;
  const blankIdx = gs.tiles.indexOf(0);
  const r1=Math.floor(idx/3), c1=idx%3, r2=Math.floor(blankIdx/3), c2=blankIdx%3;
  const adjacent = Math.abs(r1-r2)+Math.abs(c1-c2) === 1;
  if(!adjacent) return;
  [gs.tiles[idx], gs.tiles[blankIdx]] = [gs.tiles[blankIdx], gs.tiles[idx]];
  gs.moves++;
  if(isSolved(gs.tiles)){
    const timeSec = Math.round((Date.now()-gs.startedAt)/1000);
    const score = 100 - Math.max(0, gs.moves-20)*2 - timeSec*0.3;
    completeGame("puzzle", score, {moves:gs.moves, timeSec}, `Solved in ${gs.moves} moves and ${timeSec}s.`);
    return;
  }
  renderPuzzleGame(document.getElementById("board"));
}

function toggleAddForm(holder){
  if(holder.innerHTML){ holder.innerHTML=""; return; }
  holder.innerHTML = `
    <div class="patient-row" style="display:block;">
      <div class="add-patient-form">
        <div class="field"><label>Full name</label><input id="npName" placeholder="e.g. Temjen Ao"></div>
        <div class="field"><label>Age</label><input id="npAge" type="number" placeholder="e.g. 70"></div>
        <div class="field"><label>Village / Town</label><input id="npVillage" placeholder="e.g. Wokha"></div>
        <div class="field"><label>PIN (4 digits)</label><input id="npPin" maxlength="4" placeholder="1234"></div>
      </div>
      <button class="btn btn-primary btn-sm" id="saveNewPatient" style="margin-top:14px;">Save Patient</button>
    </div>
  `;
  holder.querySelector("#saveNewPatient").onclick = async ()=>{
    const name = holder.querySelector("#npName").value.trim();
    const age = holder.querySelector("#npAge").value.trim();
    const village = holder.querySelector("#npVillage").value.trim() || VILLAGES[Math.floor(Math.random()*VILLAGES.length)];
    const pin = holder.querySelector("#npPin").value.trim() || "1234";
    if(!name){ showToast("Please enter a name."); return; }
    const id = "p" + Date.now();
    state.users.push({ id, role:"patient", name, age: age||"—", village, pin });
    await saveUsers();
    await saveHistory(id, []);
    await saveReminders(id, defaultReminders());
    showToast("Patient added.");
    render();
  };
}
function computeTrend(history){
  if(history.length < 3) return { label:"Not enough data", class:"flat", flag:false };
  const recent = history.slice(-3);
  const prior = history.slice(-6,-3);
  const avg = arr => arr.reduce((a,b)=>a+b.dailyScore,0)/arr.length;
  const recentAvg = avg(recent);
  const priorAvg = prior.length ? avg(prior) : recentAvg;
  const diff = recentAvg - priorAvg;
  const lastScore = history[history.length-1].dailyScore;
  if(diff <= -10 || lastScore < 40){
    return { label:"Declining", class:"down", flag:true, reason: diff<=-10 ? `Average score dropped ${Math.abs(Math.round(diff))} points recently.` : `Most recent score was low (${lastScore}).` };
  }
  if(diff >= 6) return { label:"Improving", class:"up", flag:false };
  return { label:"Stable", class:"flat", flag:false };
}
function sparkline(history){
  const pts = history.slice(-7);
  if(pts.length<2) return `<svg width="90" height="34"></svg>`;
  const w=90,h=34, max=100, min=0;
  const stepX = w/(pts.length-1);
  const coords = pts.map((p,i)=>{
    const x = i*stepX;
    const y = h - ((p.dailyScore-min)/(max-min))*h;
    return `${x},${y}`;
  }).join(" ");
  const last = pts[pts.length-1].dailyScore;
  const first = pts[0].dailyScore;
  const color = last-first < -8 ? "#C1502E" : (last-first>4 ? "#2F6F4F" : "#8AA093");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${coords}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="260" stroke-dashoffset="260"/></svg>`;
}

function renderReminderEditor(wrap, patient, reminders){
  const holder = wrap.querySelector("#remEditor");
  wrap.querySelector("#remScheduleView").style.display = "none";
  let working = reminders.map(r=>({...r}));
  const draw = ()=>{
    holder.innerHTML = `
      <div class="summary-panel">
        ${working.map((r,i)=>`
          <div class="hist-row" data-i="${i}">
            <div class="add-patient-form" style="flex:1; grid-template-columns:2fr 1fr 1fr;">
              <div class="field"><label>What</label><input class="remLabel" value="${r.label}"></div>
              <div class="field"><label>Time</label><input class="remTime" type="time" value="${r.time}"></div>
              <div class="field"><label>Type</label>
                <select class="remType">
                  ${REMINDER_TYPES.map(rt=>`<option value="${rt.type}" ${rt.type===r.type?"selected":""}>${rt.defaultLabel}</option>`).join("")}
                </select>
              </div>
            </div>
            <button class="btn-ghost btn-sm remRemove" data-i="${i}">Remove</button>
          </div>
        `).join("")}
        <div style="display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" id="remAdd">Add reminder</button>
          <button class="btn btn-primary btn-sm" id="remSave">Save schedule</button>
          <button class="btn-ghost" id="remCancel">Cancel</button>
        </div>
      </div>
    `;
    holder.querySelectorAll(".hist-row").forEach(row=>{
      const i = parseInt(row.dataset.i);
      row.querySelector(".remLabel").onchange = e=> working[i].label = e.target.value;
      row.querySelector(".remTime").onchange = e=> working[i].time = e.target.value;
      row.querySelector(".remType").onchange = e=> working[i].type = e.target.value;
    });
    holder.querySelectorAll(".remRemove").forEach(btn=>{
      btn.onclick = ()=>{ working.splice(parseInt(btn.dataset.i),1); draw(); };
    });
    holder.querySelector("#remAdd").onclick = ()=>{
      working.push({ id:"r"+Math.random().toString(36).slice(2,8), type:"essentials", label:"New reminder", time:"12:00" });
      draw();
    };
    holder.querySelector("#remCancel").onclick = ()=>{
      holder.innerHTML = "";
      wrap.querySelector("#remScheduleView").style.display = "";
    };
    holder.querySelector("#remSave").onclick = async ()=>{
      await saveReminders(patient.id, working);
      showToast("Reminder schedule saved.");
      go("patientDetail", { viewingPatientId: patient.id });
    };
  };
  draw();
}
